spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

SecretJwtString=${JWT_SECRET}

encryption.secret-key=${ENCRYPTION_SECRET}

ai.api.key=${OPENCODE_API_KEY}
ai.api.base-url=${AI_BASE_URL:https://console.opencode.ai/inference/openai/v1}
ai.api.model=${AI_MODEL:mimo-v2.5-free}

server.port=${PORT:10000}
server.address=0.0.0.0

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.frontend.url=${FRONTEND_URL}
